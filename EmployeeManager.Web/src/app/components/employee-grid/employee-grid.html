<div class="grid-container">
  @if (employees.length > 0) {
  <mat-grid-list cols="3" rowHeight="120px" gutterSize="16px">
    @for (emp of employees; track emp.id) {
    <mat-grid-tile>
      <mat-card class="employee-tile-card">
        <div class="card-content-layout">
          <div class="employee-details">
            <h3>{{ emp.firstName }} {{ emp.lastName }}</h3>
            <p class="role-title">{{ emp.jobTitle || 'No Title Assigned' }}</p>
            <p class="contact-info"><mat-icon class="mini-icon">email</mat-icon> {{ emp.email }}</p>
            <p class="contact-info"><mat-icon class="mini-icon">phone</mat-icon> {{ emp.phone }}</p>
          </div>

          <button mat-icon-button color="warn" (click)="onRemove(emp.id)" aria-label="Delete employee">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </mat-card>
    </mat-grid-tile>
    }
  </mat-grid-list>
  } @else {
  <p class="empty-message">No employees selected yet. Search and select above to add them to your grid.</p>
  }
</div>
