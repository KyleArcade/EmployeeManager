<div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search for an employee...</mat-label>
        <input type="text" matInput #searchInput #trigger="matAutocompleteTrigger" [ngModel]="searchTerm()"
            (ngModelChange)="onSearchTermChange($event)" (keydown.enter)="onEnterKey(trigger)"
            [matAutocomplete]="auto" placeholder="E.g John Doe"
            aria-label="Search">

        <button mat-flat-button color="primary" matSuffix (click)="onSearch(trigger)"
            [disabled]="isSearchDisabled()" aria-label="Search" class="filled-search-btn">
            <h2>GO!</h2>
        </button>

        <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
            @for (employee of employees(); track employee.firstName) {
            <mat-option [value]="employee.firstName + ' ' + employee.lastName">
                {{ employee.firstName }} {{ employee.lastName }}
            </mat-option>
            }
            @if (showNoResults()) {
            <mat-option disabled>No employees found</mat-option>
            }
        </mat-autocomplete>
        @if (showMinimumLengthHint()) { <mat-hint style="color: red;">Type at least
            2 characters to search</mat-hint>
            }
    </mat-form-field>
</div>
