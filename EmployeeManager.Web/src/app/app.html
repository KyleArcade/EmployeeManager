<app-employee-search (employeeSelected)="addEmployeeToGrid($event)"></app-employee-search>
<app-employee-grid 
  [employees]="selectedEmployees" 
  (removeClicked)="removeEmployeeFromGrid($event)">
</app-employee-grid>
<div class="fab-container">
  <button mat-fab extended color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    New User
  </button>
</div>
